services:
  api:
    container_name: api-alugel
    build: .
    ports:
      - "3333:3333"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      PORT: 3333
      DATABASE_URL: postgresql://postgres:postgres@db:5432/api_alugel
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy

  db:
    container_name: postgres-alugel
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: api_alugel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d api_alugel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
